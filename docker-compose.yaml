networks:
  ledger-core:
    driver: bridge
    name: ledger-core-network

volumes:
  postgres_bancary_data:
    name: postgres_bancary_data
  postgres_auth_data:
    name: postgres_auth_data
  rabbitmq_data:
    name: rabbitmq_data

services:
  postgres-service-bancary:
    image: postgres:17-alpine
    container_name: postgres_service-bancary
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: service-bancary
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_bancary_data:/var/lib/postgresql/data
    networks:
      - ledger-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d service-bancary"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  postgres-auth-service:
    image: postgres:17-alpine
    container_name: postgres_auth-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth-service
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - ledger-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth-service"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ledger-core
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  auth-service:
    build:
      context: ./auth-service
      dockerfile: dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "9090:9090"
    environment:
      - URL_DB=jdbc:postgresql://postgres-auth-service:5432/auth-service
      - USERNAME_DB=user
      - PASSWORD_DB=password
    networks:
      - ledger-core
    depends_on:
      postgres-auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  service-bancary:
    build:
      context: ./service-bancary
      dockerfile: dockerfile
    container_name: service-bancary
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "9091:9090"
    environment:
      - URL_SERVICE_BANCARY_DB=jdbc:postgresql://postgres-service-bancary:5432/service-bancary
      - USERNAME_SERVICE_BANCARY_DB=user
      - PASSWORD_SERVICE_BANCARY_DB=password
      - RMQ_HOST=rabbitmq
      - SECRET_KEY_JWT=secreteKeyDefaultWith123456789012
      - GRPC_HISTORY_SERVICE_ADDRESS=static://service-bancary:9090
      - GRPC_USER_SERVICE_ADDRESS=static://service-bancary:9090
    networks:
      - ledger-core
    depends_on:
      postgres-service-bancary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: dockerfile
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRETE_KEY=secreteKeyDefaultWith123456789012
      - GRPC_AUTH_SERVICE_URI=grpc://auth-service:9090
      - GRPC_SERVICE_BANCARY_HOST=service-bancary
      - GRPC_SERVICE_BANCARY_PORT=9090
      - HOST_RMQ=rabbitmq
    networks:
      - ledger-core
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
      dockerfile: dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - HOST_MAIL=sandbox.smtp.mailtrap.io
      - PORT_MAIL=2525
      - USERNAME_MAIL=${USERNAME_MAIL}
      - PASSWORD_MAIL=${PASSWORD_MAIL}
      - HOST_RMQ=rabbitmq
    networks:
      - ledger-core
    depends_on:
      rabbitmq:
        condition: service_healthy
