jwt:
  secrete:
    key: "${JWT_SECRETE_KEY:secreteKeyDefaultWith123456789012}"
spring:
  application:
    name: gateway-service
  rabbitmq:
    host: ${HOST_RMQ:localhost}
    port: ${PORT_RMQ:5672}
    username: ${USERNAME_RMQ:guest}
    password: ${PASSWORD_RMQ:guest}
    virtual-host: /
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-create-user
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/auth/create-user
                - Method=POST
              filters:
                - CreateUserProducer
            - id: auth-service-authentication
              uri: grpc://localhost:9090
              predicates:
                - Path=/api/v1/auth/authentication
                - Method=POST
              filters:
                - name: JsonToGrpc
                  args:
                    service: AuthService
                    method: Authentication
                    protoDescriptor: classpath:all-services.pb
            - id: service-bancary-register-data-user
              uri: no-op://localhost
              predicates:
                - Path=/api/register-data-user
                - Method=POST
              filters:
                - RegisterDataUserProducer
            - id: service-bancary-create-account
              uri: no-op://localhost
              predicates:
                - Path=/api/create-account
                - Method=POST
              filters:
                - CreateAccountProducer
            - id: service-bancary-deposit-account
              uri: no-op://localhost
              predicates:
                - Path=/api/deposit-account
                - Method=PATCH
              filters:
                - DepositAccountProducer
            - id: service-bancary-withdraw-account
              uri: no-op://localhost
              predicates:
                - Path=/api/withdraw-account
                - Method=PATCH
              filters:
                - WithdrawAccountProducer

            - id: tests-delete-me
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/test
                - Method=GET

    stream:
      bindings:
        createUserProducer-out-0:
          destination: exchange-auth-service
        registerDataUserProducer-out-0:
          destination: exchange-user
        createAccountProducer-out-0:
          destination: exchange-account-bancary
        depositAccountProducer-out-0:
          destination: exchange-account-bancary
        withdrawAccountProducer-out-0:
          destination: exchange-account-bancary
      rabbit:
        bindings:
          createAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-create-account'"
          depositAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-deposit-account'"
          createUserProducer-out-0:
            producer:
              routing-key-expression: "'rk-create-user'"
          registerDataUserProducer-out-0:
            producer:
              routing-key-expression: "'rk-register-data-user'"
          withdrawAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-withdraw-account'"
