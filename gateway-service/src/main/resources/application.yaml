grpc:
  account-service:
    host: "${GRPC_ACCOUNT_SERVICE_HOST:localhost}"
    port: ${GRPC_ACCOUNT_SERVICE_PORT:9092}
  history-service:
    host: "${GRPC_HISTORY_SERVICE_HOST:localhost}"
    port: ${GRPC_HISTORY_SERVICE_PORT:9092}

jwt:
  secrete:
    key: "${JWT_SECRETE_KEY:secreteKeyDefaultWith123456789012}"
spring:
  application:
    name: gateway-service
  rabbitmq:
    host: ${HOST_RMQ:localhost}
    port: ${PORT_RMQ:5672}
    username: ${USERNAME_RMQ:guest}
    password: ${PASSWORD_RMQ:guest}
    virtual-host: /
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-create-user
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/auth/register
                - Method=POST
              filters:
                - CreateUserProducer

            - id: auth-service-authentication
              uri: ${GRPC_AUTH_SERVICE_URI:grpc://localhost:9091}
              predicates:
                - Path=/api/v1/auth/login
                - Method=POST
              filters:
                - name: JsonToGrpc
                  args:
                    service: AuthService
                    method: Authentication
                    protoDescriptor: classpath:auth-service.pb

            - id: service-bancary-register-data-user
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/user
                - Method=POST
              filters:
                - RegisterDataUserProducer

            - id: service-bancary-create-account
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/account
                - Method=POST
              filters:
                - CreateAccountProducer

            - id: service-bancary-deposit-account
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/account/deposit
                - Method=PATCH
              filters:
                - DepositAccountProducer

            - id: service-bancary-withdraw-account
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/account/withdraw
                - Method=PATCH
              filters:
                - WithdrawAccountProducer

            - id: transfer-money-account
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/account/transfer
                - Method=PATCH
              filters:
                - TransferMoneyAccountProducer

            - id: find-account-by-userId
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/account
                - Method=GET
              filters:
                - FindAccountByUserId

            - id: schedule-transfer-money
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/schedule/transfer
                - Method=PATCH
              filters:
                - ScheduleTransferMoneyProducer

            - id: findAll-history-by-accountId-and-yearMonth
              uri: no-op://localhost
              predicates:
                - Path=/api/v1/history/{year:\d{4}}/{month:\d{2}}
                - Method=GET
              filters:
                - FindAllHistoryByAccountIdAndYearMonth

    stream:
      bindings:
        createUserProducer-out-0:
          destination: exchange-auth-service
        registerDataUserProducer-out-0:
          destination: exchange-user
        createAccountProducer-out-0:
          destination: exchange-account-bancary
        depositAccountProducer-out-0:
          destination: exchange-account-bancary
        withdrawAccountProducer-out-0:
          destination: exchange-account-bancary
        transferMoneyAccountProducer-out-0:
          destination: exchange-account-bancary
        schedulingTransferProducer-out-0:
          destination: exchange-scheduling
      rabbit:
        bindings:
          createUserProducer-out-0:
            producer:
              routing-key-expression: "'rk-create-user'"
          createAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-create-account'"
          registerDataUserProducer-out-0:
            producer:
              routing-key-expression: "'rk-create-user'"
          depositAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-deposit-account'"
          withdrawAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-withdraw-account'"
          transferMoneyAccountProducer-out-0:
            producer:
              routing-key-expression: "'rk-transfer-money'"
          schedulingTransferProducer-out-0:
            producer:
              routing-key-expression: "'rk-tranfer-scheduling'"

springdoc:
  api-docs:
    path: /api/v1/docs/api-docs
  swagger-ui:
    path: /api/v1/docs/swagger-ui.html
    url: /openapi.yaml
